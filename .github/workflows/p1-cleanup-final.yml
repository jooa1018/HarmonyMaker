name: P1 closure branch cleanup

on:
  push:
    branches:
      - chatgpt/harmonymaker-p1-final

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary verification scaffolding
        run: |
          rm -f .github/workflows/p1-closure-verify.yml
          rm -f .github/workflows/p1-finalize-report.yml
          rm -f .github/workflows/p1-cleanup-final.yml
          rm -f docs/implementation/P1_CLOSURE_CANDIDATE.md
          rm -f docs/implementation/CHATGPT_P1_CLOSURE_STATUS.md
          rm -f docs/implementation/CHATGPT_P1_IMPLEMENTATION.md
      - name: Commit clean verified branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove temporary P1 verification scaffolding'
          git push
