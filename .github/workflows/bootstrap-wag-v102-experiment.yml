name: Bootstrap WAG v1.0.2 selector experiment

on:
  push:
    branches:
      - codex/wag-v102-selector-experiment
    paths:
      - .github/workflows/bootstrap-wag-v102-experiment.yml
      - .experiment-bootstrap/**

permissions:
  contents: write

jobs:
  install-experiment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wag-v102-selector-experiment
          fetch-depth: 0
      - name: Decode and verify experiment payload
        shell: bash
        run: |
          set -euo pipefail
          cat .experiment-bootstrap/chunk-* > /tmp/wag-v102.b64
          base64 --decode /tmp/wag-v102.b64 > /tmp/wag-v102-files.tar.gz
          echo '91a04b97b968bf58b890dddef89d1f0568527ade49208b52a0a6a67b26b5578d  /tmp/wag-v102-files.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/wag-v102-files.tar.gz -C .
          test -f src/experiments/wag-v102/experiment.ts
          test -f src/app/review/wag-v102-selector-experiment/page.tsx
          test -f docs/experiments/WAG_V1_0_2_SELECTOR_EXPERIMENT.md
      - name: Commit experiment implementation and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .experiment-bootstrap
          rm -f .github/workflows/bootstrap-wag-v102-experiment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add isolated WAG v1.0.2 selector experiment'
          git push origin HEAD:codex/wag-v102-selector-experiment
