name: Export ChatGPT closure source

# Temporary CI-only source snapshot for P2 closure verification.
on:
  push:
    branches:
      - chatgpt/harmonymaker-ultra-p1-closure
      - chatgpt/harmonymaker-ultra-p2-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/harmonymaker-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: harmonymaker-source
          path: /tmp/harmonymaker-source.tgz
          retention-days: 1
