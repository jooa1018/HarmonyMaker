name: Export provider integration source

on:
  push:
    branches:
      - chatgpt/harmonymaker-audiveris-provider

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/harmonymaker-provider-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: harmonymaker-provider-source
          path: /tmp/harmonymaker-provider-source.tgz
          retention-days: 1
