name: Fix WAG selector experiment callback ref

on:
  push:
    branches:
      - codex/wag-v102-selector-experiment
    paths:
      - .github/workflows/fix-wag-v102-oninvalid-ref.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wag-v102-selector-experiment
          fetch-depth: 0
      - run: python .experiment-patch/fix-oninvalid-ref.py
      - name: Commit final focused correction
        run: |
          rm -rf .experiment-patch
          rm -f .github/workflows/fix-wag-v102-oninvalid-ref.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: update experiment callback ref in effect"
          git push origin HEAD:codex/wag-v102-selector-experiment
