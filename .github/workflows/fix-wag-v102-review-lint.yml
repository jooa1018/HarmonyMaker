name: Fix WAG v1.0.2 experiment UI lint

on:
  push:
    branches:
      - codex/wag-v102-selector-experiment
    paths:
      - .github/workflows/fix-wag-v102-review-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wag-v102-selector-experiment
          fetch-depth: 0
      - name: Apply focused React state-boundary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/review/wag-v102-selector-experiment/ReviewClient.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  const controllerRef = useRef<ABCJS.SynthObjectController | null>(null);\n  const [ready, setReady] = useState(false);\n  const [busy, setBusy] = useState(false);\n  const [playing, setPlaying] = useState(false);\n  const [transportComplete, setTransportComplete] = useState(false);',
                  '  const controllerRef = useRef<ABCJS.SynthObjectController | null>(null);\n  const onInvalidRef = useRef(onInvalid);\n  onInvalidRef.current = onInvalid;\n  const [renderedAbc, setRenderedAbc] = useState<string | null>(null);\n  const [busy, setBusy] = useState(false);\n  const [playing, setPlaying] = useState(false);\n  const [transportComplete, setTransportComplete] = useState(false);\n  const ready = renderedAbc === side.abc;',
              ),
              (
                  '    audioRef.current?.replaceChildren();\n    setReady(false);\n    setPlaying(false);\n    setTransportComplete(false);',
                  '    audioRef.current?.replaceChildren();',
              ),
              (
                  '      setReady(Boolean(tuneRef.current));',
                  '      setRenderedAbc(tuneRef.current ? side.abc : null);',
              ),
              (
                  '    void render().catch(() => onInvalid("INITIALIZATION_FAILURE"));',
                  '    void render().catch(() => onInvalidRef.current("INITIALIZATION_FAILURE"));',
              ),
              (
                  '  }, [onInvalid, side.abc]);',
                  '  }, [side.abc]);',
              ),
              (
                  '''  useEffect(() => {
    let current = window.localStorage.getItem(SESSION_KEY);
    if (!current) {
      current = window.crypto.randomUUID();
      window.localStorage.setItem(SESSION_KEY, current);
    }
    setSeed(current);
    const stored = loadStoredResponses();
    setResponses(stored);
    const firstUnanswered = items.findIndex((item) => !stored[item.id]);
    setIndex(firstUnanswered < 0 ? Math.max(0, items.length - 1) : firstUnanswered);
  }, [items]);''',
                  '''  useEffect(() => {
    let cancelled = false;
    queueMicrotask(() => {
      if (cancelled) return;
      let current = window.localStorage.getItem(SESSION_KEY);
      if (!current) {
        current = window.crypto.randomUUID();
        window.localStorage.setItem(SESSION_KEY, current);
      }
      const stored = loadStoredResponses();
      const firstUnanswered = items.findIndex((item) => !stored[item.id]);
      setSeed(current);
      setResponses(stored);
      setIndex(firstUnanswered < 0 ? Math.max(0, items.length - 1) : firstUnanswered);
    });
    return () => {
      cancelled = true;
    };
  }, [items]);''',
              ),
              (
                  '        <BlindPlayer\n          label="A"',
                  '        <BlindPlayer\n          key={`${item.id}:A:${sideA.variant}`}\n          label="A"',
              ),
              (
                  '        <BlindPlayer\n          label="B"',
                  '        <BlindPlayer\n          key={`${item.id}:B:${sideB.variant}`}\n          label="B"',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit focused fix and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-wag-v102-review-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize WAG v1.0.2 listening UI state'
          git push origin HEAD:codex/wag-v102-selector-experiment
