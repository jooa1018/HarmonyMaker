name: Fix WAG selector experiment UI lint

on:
  push:
    branches:
      - codex/wag-v102-selector-experiment
    paths:
      - .github/workflows/fix-wag-v102-review-lint.yml
      - .experiment-patch/fix-review-client.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wag-v102-selector-experiment
          fetch-depth: 0
      - run: python .experiment-patch/fix-review-client.py
      - name: Commit focused fix
        run: |
          rm -rf .experiment-patch
          rm -f .github/workflows/fix-wag-v102-review-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize WAG v1.0.2 listening UI state"
          git push origin HEAD:codex/wag-v102-selector-experiment
