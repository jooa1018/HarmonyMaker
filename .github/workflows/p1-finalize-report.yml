name: P1 closure finalization

on:
  push:
    branches:
      - chatgpt/harmonymaker-p1-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harmonymaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harmonymaker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harmonymaker_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harmonymaker_migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Run default test suite and capture counts
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/default-tests.log
      - name: Run PostgreSQL suite and capture counts
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee /tmp/postgres-tests.log
      - name: Verify migration fresh apply and idempotent repeat
        run: |
          createdb -h 127.0.0.1 -U postgres harmonymaker_migrate
          npm run migrate | tee /tmp/migrate-first.log
          npm run migrate | tee /tmp/migrate-second.log
      - run: npm run build
      - run: git diff --check
      - name: Verify P1 closure authority surfaces
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (p) => fs.readFileSync(p, 'utf8');
          const checks = {
            workspaceRevision: /routeGeneration/.test(read('src/product/workspace-route-state.ts')) && /revisionGeneration/.test(read('src/product/workspace-route-state.ts')) && /saveIfCurrent/.test(read('src/product/local-project-store.ts')),
            fractionalHarmony: /MUSICXML_HARMONY_OFFSET_UNREPRESENTABLE/.test(read('src/product/musicxml-export.ts')) && /effectiveChordTimeline\.spans/.test(read('src/product/musicxml-export.ts')),
            shareCrossTab: /claimOrLoad/.test(read('src/product/share-create-recovery.ts')) && /operationGeneration/.test(read('src/product/share-create-recovery.ts')),
            omrCrossSession: fs.existsSync('src/server/omr/cross-session-create-recovery.ts') && fs.existsSync('src/server/persistence/migrations/015_omr_create_cross_session_recovery.sql') && /withCrossSessionOmrCreateRecovery/.test(read('src/server/substrate/services.ts')),
            pageSelectionFence: fs.existsSync('src/app/omr/browser-selection-generation.ts') || /selectionGeneration/.test(read('src/app/omr/OmrClient.tsx')),
            cleanupFairness: fs.existsSync('src/server/omr/cleanup-fairness.test.ts') || /cleanup_last_attempt_at/.test(read('src/server/omr/postgres-store.ts')),
          };
          fs.writeFileSync('/tmp/p1-checks.json', JSON.stringify(checks, null, 2));
          if (Object.values(checks).some((value) => !value)) process.exit(1);
          NODE
      - name: Record verified closure report
        env:
          VERIFIED_CODE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/implementation
          DEFAULT_FILES=$(sed -nE 's/.*Test Files[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/default-tests.log | tail -1)
          DEFAULT_TESTS=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/default-tests.log | tail -1)
          PG_FILES=$(sed -nE 's/.*Test Files[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/postgres-tests.log | tail -1)
          PG_TESTS=$(sed -nE 's/.*Tests[[:space:]]+([0-9]+) passed.*/\1/p' /tmp/postgres-tests.log | tail -1)
          cat > docs/implementation/P1_CLOSURE_VERIFIED_REPORT.md <<EOF
          # HarmonyMaker P1 closure verified report

          This report was generated only after the P1 closure branch passed its full automated verification workflow.

          \`\`\`text
          VERIFIED_CODE_SHA = ${VERIFIED_CODE_SHA}
          npm ci = PASS
          typecheck = PASS
          lint = PASS
          npm test = PASS
          DEFAULT_TEST_FILES = ${DEFAULT_FILES:-unknown}
          DEFAULT_TEST_COUNT = ${DEFAULT_TESTS:-unknown}
          npm run test:postgres = PASS
          POSTGRES_TEST_FILES = ${PG_FILES:-unknown}
          POSTGRES_TEST_COUNT = ${PG_TESTS:-unknown}
          migration fresh apply = PASS
          migration repeated apply = PASS
          build = PASS
          git diff --check = PASS

          P1_REAUDIT_01 = CLOSED_CANDIDATE
          P1_REAUDIT_02 = CLOSED_CANDIDATE
          P1_REAUDIT_03 = CLOSED_CANDIDATE
          P1_REAUDIT_04 = CLOSED_CANDIDATE
          P1_REAUDIT_05 = CLOSED_CANDIDATE
          P1_REAUDIT_06 = CLOSED_CANDIDATE

          MAIN_CHANGED = NO
          MAIN_MERGE_READY = REQUIRES_INDEPENDENT_FINAL_REVIEW
          \`\`\`
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/implementation/P1_CLOSURE_VERIFIED_REPORT.md
          git commit -m 'docs: record verified P1 closure candidate'
          git push
