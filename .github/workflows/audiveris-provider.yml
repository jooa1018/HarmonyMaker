name: Audiveris provider

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "services/audiveris-provider/**"
      - "src/server/omr/audiveris-http-adapter.ts"
      - "src/server/omr/audiveris-http-adapter.test.ts"
      - "src/server/omr/production-service.ts"
      - "src/server/substrate/config.ts"
      - ".github/workflows/audiveris-provider.yml"
  push:
    branches:
      - chatgpt/harmonymaker-audiveris-provider
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "services/audiveris-provider/**"
      - "src/server/omr/audiveris-http-adapter.ts"
      - "src/server/omr/audiveris-http-adapter.test.ts"
      - "src/server/omr/production-service.ts"
      - "src/server/substrate/config.ts"
      - ".github/workflows/audiveris-provider.yml"

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/audiveris-provider/requirements-test.txt
      - run: pip install -r services/audiveris-provider/requirements-test.txt
      - run: pytest services/audiveris-provider/tests
        env:
          PYTHONPATH: services/audiveris-provider
          HM_AUDIVERIS_API_KEY: test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          HM_AUDIVERIS_FAKE_ENGINE: "1"
      - name: Build pinned real Audiveris image
        run: docker build --build-arg AUDIVERIS_VERSION=5.10.2 -t hm-audiveris:${{ github.sha }} .
      - name: Verify bundled Audiveris launcher
        run: docker run --rm --entrypoint /usr/local/bin/audiveris hm-audiveris:${{ github.sha }} -version | tee /tmp/audiveris-version.txt
      - name: Verify deployed engine profile wrapper
        run: |
          docker run --rm --entrypoint sh hm-audiveris:${{ github.sha }} -c '
            test "$AUDIVERIS_BIN" = /app/audiveris-wrapper.sh
            test -x "$AUDIVERIS_BIN"
            test -f /app/recognition_preprocess.py
            test "$HM_AUDIVERIS_OCR_LANGUAGES" = "eng+kor"
            grep -Fq "recognition_preprocess.py" "$AUDIVERIS_BIN"
            grep -Fq "org.audiveris.omr.sheet.ProcessingSwitches.chordNames=true" "$AUDIVERIS_BIN"
            grep -Fq "org.audiveris.omr.text.Language.defaultSpecification" "$AUDIVERIS_BIN"
            tesseract --list-langs 2>/dev/null | grep -Fxq eng
            tesseract --list-langs 2>/dev/null | grep -Fxq kor
            "$AUDIVERIS_BIN" -version
          '
      - name: Fake-engine HTTP protocol smoke
        run: |
          docker run -d --name hm-audiveris-smoke -p 127.0.0.1:8001:8000 \
            -e HM_AUDIVERIS_API_KEY=test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e HM_AUDIVERIS_FAKE_ENGINE=1 \
            hm-audiveris:${{ github.sha }}
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8001/health && break; sleep 2; done
          python - <<'PY'
          from PIL import Image, ImageDraw
          image = Image.new("RGB", (1200, 1600), "white")
          draw = ImageDraw.Draw(image)
          for row in range(5): draw.line((100, 500 + row * 24, 1100, 500 + row * 24), fill="black", width=3)
          draw.ellipse((520, 550, 555, 575), fill="black")
          draw.line((553, 560, 553, 450), fill="black", width=5)
          image.save("/tmp/provider-page.png")
          PY
          node scripts/audiveris-provider-smoke.mjs http://127.0.0.1:8001 test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx /tmp/provider-page.png
      - if: always()
        run: docker logs hm-audiveris-smoke || true
      - if: always()
        run: docker rm -f hm-audiveris-smoke || true
      - name: Real Audiveris HTTP MusicXML and chord OCR capability smoke
        timeout-minutes: 30
        run: |
          mkdir -p /tmp/audiveris-real
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/randomm/audiveris-api/main/tests/test_files/o-happy-day.pdf \
            -o /tmp/audiveris-real/score.pdf
          docker run --rm --user 0:0 -v /tmp/audiveris-real:/work --entrypoint pdftoppm \
            hm-audiveris:${{ github.sha }} -png -f 1 -singlefile -r 300 /work/score.pdf /work/page
          docker run -d --name hm-audiveris-real -p 127.0.0.1:8002:8000 \
            -e HM_AUDIVERIS_API_KEY=test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata \
            -e 'JAVA_TOOL_OPTIONS=-Xmx2g -Djava.awt.headless=true' \
            hm-audiveris:${{ github.sha }}
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8002/health && break; sleep 2; done
          node scripts/audiveris-provider-smoke.mjs http://127.0.0.1:8002 test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx /tmp/audiveris-real/page.png

          # Explicit chord-symbol fixture: C7 and F are visibly printed above the staff.
          # CharlesGillingham, CC BY-SA 3.0 / GFDL, Wikimedia Commons.
          # https://commons.wikimedia.org/wiki/File:Lead_Sheet.png
          curl -fsSL --retry 3 \
            https://upload.wikimedia.org/wikipedia/commons/9/9c/Lead_Sheet.png \
            -o /tmp/audiveris-real/chord-page.png

          # Chord-specific Tesseract capability gate. Whole-page free-form OCR is easily
          # distracted by staff lines, so aggregate several sparse/block modes while
          # restricting recognition to the chord-symbol alphabet.
          docker run --rm -v /tmp/audiveris-real:/work --entrypoint sh hm-audiveris:${{ github.sha }} -c '
            ocr="$(
              for psm in 6 11 12; do
                tesseract /work/chord-page.png stdout -l eng --psm "$psm" \
                  -c "tessedit_char_whitelist=ABCDEFGabcdefg#b0123456789/()+-" 2>/dev/null || true
              done
            )"
            printf "%s\n" "$ocr"
            printf "%s\n" "$ocr" | grep -Eiq "(^|[^A-Za-z0-9])C7([^A-Za-z0-9]|$)"
            printf "%s\n" "$ocr" | grep -Eiq "(^|[^A-Za-z0-9])F([^A-Za-z0-9]|$)"
          '

          # Audiveris' own harmony export is observed but is not a release gate: 5.10.2 may
          # omit chord-name OCR from MusicXML even when independent OCR sees printed tokens.
          node scripts/audiveris-provider-smoke.mjs http://127.0.0.1:8002 test-provider-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx /tmp/audiveris-real/chord-page.png
      - if: always()
        run: docker logs hm-audiveris-real || true
      - if: always()
        run: docker rm -f hm-audiveris-real || true
