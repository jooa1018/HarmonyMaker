name: Apply ChatGPT P1 patches

on:
  push:
    branches:
      - chatgpt/harmonymaker-ultra-p1-closure
    paths:
      - scripts/apply-chatgpt-omr-client-patch.mjs
      - .github/workflows/apply-chatgpt-p1-patches.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/harmonymaker-ultra-p1-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patch
        run: node scripts/apply-chatgpt-omr-client-patch.mjs
      - name: Commit patched production caller
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "ChatGPT"
          git config user.email "chatgpt@openai.com"
          git add src/app/omr/OmrClient.tsx
          git commit -m "fix: fence OMR page selection generation"
          git push origin HEAD:chatgpt/harmonymaker-ultra-p1-closure
