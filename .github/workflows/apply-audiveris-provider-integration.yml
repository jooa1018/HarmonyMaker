name: Apply Audiveris provider integration

on:
  push:
    branches:
      - chatgpt/harmonymaker-audiveris-provider
    paths:
      - scripts/audiveris-overlay.b64.part04

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/harmonymaker-audiveris-provider
          fetch-depth: 0
      - name: Reassemble and apply complete integration overlay
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/audiveris-overlay.b64.part* | base64 -d > /tmp/audiveris-overlay.tar.gz
          tar -xzf /tmp/audiveris-overlay.tar.gz -C .
          rm -f scripts/audiveris-overlay.b64.part*
          rm -f scripts/provider-integration.patch.b64.part00
          rm -f scripts/apply-chatgpt-omr-client-patch.mjs
          rm -rf scripts/chatgpt-patches
          rm -f .github/workflows/apply-audiveris-provider-integration.yml
          rm -f .github/workflows/apply-chatgpt-p1-patches.yml
          rm -f .github/workflows/export-chatgpt-source.yml
          rm -f .github/workflows/export-provider-source.yml
      - name: Commit integrated provider
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@openai.com"
          git add -A
          git commit -m "feat: integrate free self-hosted Audiveris OMR provider"
          git push origin HEAD:chatgpt/harmonymaker-audiveris-provider
