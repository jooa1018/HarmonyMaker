name: Apply Audiveris provider integration

on:
  push:
    branches:
      - chatgpt/harmonymaker-audiveris-provider
    paths:
      - scripts/apply-audiveris-provider-patch.py.part04

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/harmonymaker-audiveris-provider
          fetch-depth: 0
      - name: Reassemble and apply complete integration overlay
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/apply-audiveris-provider-patch.py.part* > /tmp/apply-audiveris-provider-patch.py
          python /tmp/apply-audiveris-provider-patch.py
          rm -f scripts/apply-audiveris-provider-patch.py.part*
      - name: Commit integrated provider
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@openai.com"
          git add -A
          git commit -m "feat: integrate free self-hosted Audiveris OMR provider"
          git push origin HEAD:chatgpt/harmonymaker-audiveris-provider
